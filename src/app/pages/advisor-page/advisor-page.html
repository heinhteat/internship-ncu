<div class="jumbotron jumbotron-fluid m-3 py-4 rounded">
  <div class="container mt-4">
    <h2>{{ isEditMode ? 'Edit Advisor' : 'Add New Advisor' }}</h2>

    <form [formGroup]="advisorForm" (ngSubmit)="onSubmit()" class="mt-3">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Advisor Code / ID</label>
          <input type="text" class="form-control" formControlName="advisorId" />
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Title</label>
          <input type="text" class="form-control" formControlName="title" placeholder="Dr., Prof., etc." />
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">First Name</label>
          <input type="text" class="form-control" formControlName="firstName" />
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Last Name</label>
          <input type="text" class="form-control" formControlName="lastName" />
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" formControlName="email" />
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Phone</label>
          <input type="text" class="form-control" formControlName="phone" />
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Department</label>
          <input type="text" class="form-control" formControlName="department" />
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Max Students Capacity</label>
          <input type="number" class="form-control" formControlName="maxStudents" />
        </div>
      </div>

      <div class="mt-3">
        <button type="submit" class="btn btn-success me-2" [disabled]="advisorForm.invalid">
          {{ isEditMode ? 'Update' : 'Save' }}
        </button>
        <a routerLink="/advisors" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
